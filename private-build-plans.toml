# Josefka

[collectPlans.Josefka]
from = [
  "JosefkaMono",
  "JosefkaMonoSlab",
  "JosefkaFixed",
  "JosefkaFixedSlab",
  "JosefkaText",
  "JosefkaTextSlab"
]

[buildPlans.JosefkaMono]
family = "Josefka Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false

[buildPlans.JosefkaMonoSlab]
family = "Josefka Mono Slab"
spacing = "normal"
serifs = "slab"
noCvSs = true
noLigation = true
exportGlyphNames = false
variants.inherits = "buildPlans.JosefkaMono"
weights.inherits = "buildPlans.JosefkaMono"
widths.inherits = "buildPlans.JosefkaMono"
slopes.inherits = "buildPlans.JosefkaMono"

[buildPlans.JosefkaFixed]
family = "Josefka Fixed"
spacing = "fixed"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false
variants.inherits = "buildPlans.JosefkaMono"
weights.inherits = "buildPlans.JosefkaMono"
widths.inherits = "buildPlans.JosefkaMono"
slopes.inherits = "buildPlans.JosefkaMono"

[buildPlans.JosefkaFixedSlab]
family = "Josefka Fixed Slab"
spacing = "fixed"
serifs = "slab"
noCvSs = true
noLigation = true
exportGlyphNames = false
variants.inherits = "buildPlans.JosefkaMonoSlab"
weights.inherits = "buildPlans.JosefkaMonoSlab"
widths.inherits = "buildPlans.JosefkaMonoSlab"
slopes.inherits = "buildPlans.JosefkaMonoSlab"

[buildPlans.JosefkaText]
family = "Josefka Text"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false
variants.inherits = "buildPlans.JosefkaMono"
weights.inherits = "buildPlans.JosefkaMono"
widths.inherits = "buildPlans.JosefkaMono"
slopes.inherits = "buildPlans.JosefkaMono"

[buildPlans.JosefkaTextSlab]
