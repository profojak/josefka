# Josefka

[collectPlans.Josefka]
from = [
  "JosefkaMono",
  "JosefkaFixed"
]

[buildPlans.JosefkaMono]
family = "Josefka Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false

[buildPlans.JosefkaFixed]
family = "Josefka Fixed"
spacing = "fixed"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false
variants.inherits = "buildPlans.JosefkaMono"
weights.inherits = "buildPlans.JosefkaMono"
widths.inherits = "buildPlans.JosefkaMono"
slopes.inherits = "buildPlans.JosefkaMono"

